name: Build Touch Bar Studio (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies without package scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build source and run checks
        run: ./build-local.sh
